<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Our Wedding Gift | Francesca & Joris</title>

  <!-- Non indicizzare questa pagina -->
  <meta name="robots" content="noindex, nofollow, noarchive">

  <!-- Stessi font del sito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lora:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --background: 200 60% 95%;
      --foreground: 100 15% 24%;
      --card: 200 50% 92%;
      --accent: 195 55% 70%;
      --gold: 42 85% 55%;
      --gold-soft: 42 60% 70%;
      --countdown: 195 35% 50%;

      --font-display: "Cormorant Garamond", serif;
      --font-body: "Lora", serif;

      --shadow-soft:
        0 2px 15px -3px rgba(58, 69, 52, .08),
        0 4px 6px -2px rgba(58, 69, 52, .04);

      --shadow-elegant:
        0 10px 40px -10px rgba(58, 69, 52, .15),
        0 4px 15px -3px rgba(58, 69, 52, .08);

      --max: 1100px;
    }


    * {
      box-sizing: border-box;
    }


    html {
      min-height: 100%;
    }


    body {
      margin: 0;
      min-height: 100vh;

      background: hsl(var(--background));
      color: hsl(var(--foreground));

      font-family: var(--font-body);

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      overflow-x: hidden;
    }


    /* ========================================
       SFONDO
       ======================================== */

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 0;

      opacity: .55;
    }


    body::before {
      background:
        radial-gradient(
          650px 460px at 12% 14%,
          hsla(var(--gold) / .14),
          transparent 60%
        ),

        radial-gradient(
          650px 460px at 90% 20%,
          hsla(var(--accent) / .10),
          transparent 65%
        );

      filter: blur(1px);
    }


    body::after {
      background:
        radial-gradient(
          760px 560px at 85% 90%,
          hsla(var(--gold-soft) / .15),
          transparent 72%
        );

      filter: blur(1px);
    }


    /* ========================================
       PAGINA
       ======================================== */

    .giftPage {
      position: relative;
      z-index: 1;

      width: min(var(--max), 100%);

      margin: 0 auto;

      padding:
        clamp(70px, 9vw, 115px)
        20px
        clamp(70px, 9vw, 110px);

      text-align: center;
    }


    /* ========================================
       PICCOLO TITOLO
       ======================================== */

    .smallTitle {
      font-family: var(--font-body);

      font-size: 14px;

      text-transform: uppercase;

      letter-spacing: .16em;

      color: hsl(var(--countdown));

      opacity: .82;

      margin-bottom: 22px;
    }


    /* ========================================
       FRASE PRINCIPALE
       ======================================== */

    .introText {
      max-width: 930px;

      margin: 0 auto 52px;
    }


    .introText h1 {
      margin: 0;

      font-family: var(--font-display);

      font-weight: 500;

      font-size: clamp(38px, 5vw, 60px);

      line-height: 1.10;

      letter-spacing: .01em;

      color: hsl(var(--foreground));
    }


    .introText .highlight {
      color: hsl(var(--countdown));
    }


    /* ========================================
       LINEA DECORATIVA
       ======================================== */

    .divider {
      width: min(520px, 72%);

      height: 1px;

      background: rgba(0, 0, 0, .10);

      margin: 34px auto 0;
    }


    /* ========================================
       VIDEO
       ======================================== */

    .videoSection {
      width: min(960px, 100%);

      margin: 0 auto;
    }


    .videoFrame {
      position: relative;

      width: 100%;

      aspect-ratio: 16 / 9;

      background: #000;

      border-radius: 18px;

      overflow: hidden;

      box-shadow: var(--shadow-elegant);
    }


    /* ========================================
       PREVIEW
       ======================================== */

    .videoPreview {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      padding: 0;

      border: 0;

      display: block;

      cursor: pointer;

      background: #000;
    }


    .videoPreview img {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* Velo leggero sopra la preview */

    .videoPreview::after {
      content: "";

      position: absolute;

      inset: 0;

      background: rgba(0, 0, 0, .08);

      transition: background .25s ease;
    }


    .videoPreview:hover::after {
      background: rgba(0, 0, 0, .15);
    }


    /* ========================================
       PULSANTE PLAY
       ======================================== */

    .playButton {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 2;

      width: 82px;
      height: 82px;

      border-radius: 50%;

      background: rgba(255, 255, 255, .92);

      box-shadow:
        0 8px 30px rgba(0, 0, 0, .22);

      display: flex;

      align-items: center;
      justify-content: center;

      transition:
        transform .25s ease,
        background .25s ease;
    }


    .videoPreview:hover .playButton {
      transform:
        translate(-50%, -50%)
        scale(1.06);

      background: #fff;
    }


    .playTriangle {
      width: 0;
      height: 0;

      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;

      border-left:
        21px solid hsl(var(--countdown));

      margin-left: 5px;
    }


    /* ========================================
       PLAYER GOOGLE DRIVE
       ======================================== */

    .videoFrame iframe {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

      background: #000;
    }


    /* ========================================
       FRASE FINALE
       ======================================== */

    .closing {
      max-width: 850px;

      margin: 55px auto 0;
    }


    .closing p {
      margin: 0;

      font-family: var(--font-display);

      font-size: clamp(38px, 4.8vw, 56px);

      font-weight: 500;

      line-height: 1.12;

      color: hsl(var(--countdown));
    }


    /* ========================================
       FIRMA
       ======================================== */

    .signature {
      margin-top: 24px;

      font-family: var(--font-body);

      font-size: 13px;

      letter-spacing: .16em;

      text-transform: uppercase;

      color: hsla(var(--foreground) / .62);
    }


    /* ========================================
       ANIMAZIONE
       ======================================== */

    .reveal {
      opacity: 0;

      transform: translateY(14px);

      animation: reveal 900ms ease forwards;
    }


    .videoSection {
      animation-delay: 180ms;
    }


    .closing {
      animation-delay: 350ms;
    }


    @keyframes reveal {

      to {
        opacity: 1;

        transform: translateY(0);
      }

    }


    /* ========================================
       MOBILE
       ======================================== */

    @media (max-width: 700px) {

      .giftPage {
        padding:
          55px
          14px
          65px;
      }


      .smallTitle {
        font-size: 12px;

        margin-bottom: 18px;
      }


      .introText {
        margin-bottom: 36px;
      }


      .introText h1 {
        font-size: clamp(32px, 9.5vw, 43px);

        line-height: 1.08;
      }


      .divider {
        margin-top: 27px;
      }


      .videoFrame {
        border-radius: 14px;
      }


      .playButton {
        width: 68px;
        height: 68px;
      }


      .playTriangle {
        border-top-width: 11px;
        border-bottom-width: 11px;

        border-left-width: 18px;
      }


      .closing {
        margin-top: 42px;
      }


      .closing p {
        font-size: clamp(32px, 9vw, 43px);
      }


      .signature {
        font-size: 11px;

        margin-top: 20px;
      }

    }


    @media (max-width: 380px) {

      .introText h1 {
        font-size: 31px;
      }


      .closing p {
        font-size: 31px;
      }

    }

  </style>

</head>


<body>


  <main class="giftPage">


    <!-- ======================================
         INTRO
         ====================================== -->

    <section class="introText reveal">

      <div class="smallTitle">
        Our Wedding Gift
      </div>


      <h1>

        Instead of traditional wedding favours,<br>

        we chose to support<br>

        <span class="highlight">
          a children's home in Mombasa.
        </span>

      </h1>


      <div class="divider"></div>

    </section>



    <!-- ======================================
         VIDEO
         ====================================== -->

    <section class="videoSection reveal">

      <div
        class="videoFrame"
        id="videoFrame"
      >


        <button
          class="videoPreview"
          id="videoPreview"
          type="button"
          aria-label="Play our wedding gift video"
        >


          <img
            src="video_preview.jpg"
            alt="Our wedding gift in Mombasa"
          >


          <span class="playButton">

            <span class="playTriangle"></span>

          </span>


        </button>


      </div>

    </section>



    <!-- ======================================
         FINALE
         ====================================== -->

    <section class="closing reveal">

      <p>
        Thank you for knocking with us.
      </p>


      <div class="signature">
        Francesca &amp; Joris
      </div>

    </section>


  </main>



  <!-- ========================================
       SCRIPT VIDEO
       ======================================== -->

  <script>

    const videoPreview =
      document.getElementById("videoPreview");


    const videoFrame =
      document.getElementById("videoFrame");


    videoPreview.addEventListener(
      "click",
      function () {


        const iframe =
          document.createElement("iframe");


        iframe.src =
          "https://drive.google.com/file/d/1Ny-MsbXD-gemGKuo0fdeRk8xx7Tx6LEY/preview?autoplay=1";


        iframe.title =
          "Our Wedding Gift";


        iframe.allow =
          "autoplay; fullscreen";


        iframe.setAttribute(
          "allowfullscreen",
          ""
        );


        iframe.setAttribute(
          "webkitallowfullscreen",
          ""
        );


        videoFrame.innerHTML = "";


        videoFrame.appendChild(iframe);


      }
    );

  </script>


</body>

</html>
